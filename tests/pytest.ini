# Configuration principale des tests Pytest.
#
# Le projet utilise des imports absolus tels que :
# from backend.core.business.intent_classifier import ...
#
# La racine du projet est ajoutée au chemin d'import Python afin que
# les packages backend et tests soient accessibles pendant la collecte
# et l'exécution des tests.

[pytest]
pythonpath = .
testpaths = tests

norecursedirs =
    tests/debug
    .git
    .pytest_cache
    __pycache__
    venv
    .venv

python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

addopts =
    -ra
    --strict-markers

markers =
    unit: tests unitaires rapides et isolés
    integration: tests nécessitant plusieurs composants ou services externes
    diagnostic: scénarios de validation fonctionnelle et métier
    live: tests effectuant de vrais appels vers Azure OpenAI